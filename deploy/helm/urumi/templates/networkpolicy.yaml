{{- if .Values.networkPolicies.enabled }}
# Deny by default: nothing may reach any pod unless a rule below allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# The public front door (the ingress controller) may reach only what is meant to be public.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-ingress-controller
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [frontend, admin-api, gateway, wordpress] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicies.ingressNamespace }} }
---
# The MCP servers (including WooCommerce) answer only the gateway and the admin API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-servers-internal-only
spec:
  podSelector: { matchLabels: { tier: mcp } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [gateway, admin-api] }
---
# The chat agent (in the admin API) reaches the gateway as the user.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-from-admin-api
spec:
  podSelector: { matchLabels: { app: gateway } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: admin-api } }
---
# Only our backend (and the setup job) may open the gateway database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-backend
spec:
  podSelector: { matchLabels: { app: postgres } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [gateway, admin-api, bootstrap] }
---
# Only WordPress (and its setup job) may open the store database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mariadb-from-wordpress
spec:
  podSelector: { matchLabels: { app: mariadb } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [wordpress, store-setup] }
---
# The WooCommerce MCP server and the setup job may call the store's internal address.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wordpress-from-mcp
spec:
  podSelector: { matchLabels: { app: wordpress } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [woocommerce-mcp, store-setup] }
{{- end }}
