{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: urumi-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  ADMIN_SESSION_SECRET: {{ .Values.secrets.adminSessionSecret | quote }}
  CHAT_GATEWAY_SECRET: {{ .Values.secrets.chatGatewaySecret | quote }}
  LLM_API_KEY: {{ .Values.secrets.llmApiKey | quote }}
  DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  DB_ROOT_PASSWORD: {{ .Values.secrets.dbRootPassword | quote }}
  WP_ADMIN_PASSWORD: {{ .Values.secrets.wpAdminPassword | quote }}
  WOOCOMMERCE_CONSUMER_KEY: {{ .Values.secrets.wooConsumerKey | quote }}
  WOOCOMMERCE_CONSUMER_SECRET: {{ .Values.secrets.wooConsumerSecret | quote }}
{{- end }}
