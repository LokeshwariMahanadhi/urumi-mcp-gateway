# The WooCommerce store: MariaDB + WordPress, each with its own volume.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
spec:
  serviceName: mariadb
  replicas: 1
  selector: { matchLabels: { app: mariadb } }
  template:
    metadata: { labels: { app: mariadb } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mariadb
          image: mariadb:11.4
          args: ["--innodb-buffer-pool-size=64M", "--max-connections=30", "--performance-schema=OFF"]
          ports: [{ containerPort: 3306 }]
          env:
            - { name: MARIADB_DATABASE, value: wordpress }
            - { name: MARIADB_USER, value: wp_user }
            - name: MARIADB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "urumi.secretName" . }}, key: DB_PASSWORD } }
            - name: MARIADB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "urumi.secretName" . }}, key: DB_ROOT_PASSWORD } }
          readinessProbe:
            exec: { command: ["healthcheck.sh", "--connect", "--innodb_initialized"] }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec: { command: ["healthcheck.sh", "--connect"] }
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
          resources: {{ toYaml .Values.resources.mariadb | nindent 12 }}
          volumeMounts: [{ name: data, mountPath: /var/lib/mysql }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.storage.storageClass }}
        storageClassName: {{ .Values.storage.storageClass }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.storage.mariadb }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
spec:
  selector: { app: mariadb }
  ports: [{ port: 3306, targetPort: 3306 }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-data
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.storage.storageClass }}
  storageClassName: {{ .Values.storage.storageClass }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.storage.wordpress }} } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: wordpress } }
  template:
    metadata: { labels: { app: wordpress } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: wordpress
          image: wordpress:apache
          ports: [{ containerPort: 80 }]
          env:
            - { name: WORDPRESS_DB_HOST, value: mariadb }
            - { name: WORDPRESS_DB_NAME, value: wordpress }
            - { name: WORDPRESS_DB_USER, value: wp_user }
            - name: WORDPRESS_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "urumi.secretName" . }}, key: DB_PASSWORD } }
            # Use whatever address the visitor (or the MCP server) used, so the store works
            # on its public address and on the internal address "wordpress".
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                $urumi_host = isset($_SERVER['HTTP_HOST']) ? $_SERVER['HTTP_HOST'] : getenv('STORE_HOST');
                define('WP_HOME', '{{ .Values.ingress.scheme }}://' . $urumi_host);
                define('WP_SITEURL', '{{ .Values.ingress.scheme }}://' . $urumi_host);
                {{- if eq .Values.ingress.scheme "https" }}
                $_SERVER['HTTPS'] = 'on';
                {{- end }}
          readinessProbe:
            tcpSocket: { port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 80 }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources: {{ toYaml .Values.resources.wordpress | nindent 12 }}
          volumeMounts: [{ name: html, mountPath: /var/www/html }]
      volumes:
        - name: html
          persistentVolumeClaim: { claimName: wordpress-data }
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress
spec:
  selector: { app: wordpress }
  ports: [{ port: 80, targetPort: 80 }]
